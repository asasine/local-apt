[package]
authors = ["Adam Sasine <asasine@users.noreply.github.com>"]
categories = ["command-line-utilities"]
description = "Create local APT repositories from HTTP downloads of .deb packages."
edition = "2024"
homepage = "https://github.com/asasine/local-apt"
keywords = ["apt", "deb"]
license = "Apache-2.0"
name = "local-apt"
repository = "https://github.com/asasine/local-apt.git"
version = "1.6.1"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
fs2 = "0.4"
httpdate = "1"
human-panic = "2.0.8"
regex = "1.12.3"
reqwest = { version = "0.11", features = [
    "blocking",
    "json",
    "rustls-tls",
], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syslog-tracing = "0.3.1"
tempfile = "3.8"
thiserror = "2"
toml = "0.9.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "std",
] }
