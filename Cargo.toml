[package]
authors = ["Adam Sasine <asasine@users.noreply.github.com>"]
categories = ["command-line-utilities"]
description = "Create local APT repositories from HTTP downloads of .deb packages."
edition = "2024"
homepage = "https://github.com/asasine/local-apt"
keywords = ["apt", "deb"]
license = "Apache-2.0"
name = "local-apt"
repository = "https://github.com/asasine/local-apt.git"
version = "1.7.0"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4.3"
httpdate = "1.0.3"
human-panic = "2.0.8"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = [
    "blocking",
    "json",
    "rustls",
], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syslog-tracing = "0.3.1"
tempfile = "3.27.0"
thiserror = "2"
toml = "1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "std",
] }
